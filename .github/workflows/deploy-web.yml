name: Deploy online app (GitHub Pages)

# Publishes the static browser app in web/ to GitHub Pages.
# The app runs entirely client-side (Pyodide); there is no server.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - "templates/**"
      - "rules/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vendor the parsers/templates/rules into web/
        run: python web/build_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
